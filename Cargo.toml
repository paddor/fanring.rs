[package]
name = "fanring"
version = "0.2.1"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "High-throughput typed MPSC and MPMC channels with per-producer backpressure"
repository = "https://github.com/paddor/fanring.rs"
documentation = "https://docs.rs/fanring"
readme = "README.md"
keywords = ["mpsc", "mpmc", "ring-buffer", "lock-free", "batching"]
categories = ["concurrency", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(loom)"]

[dependencies]
arc-swap = "1.7"
concurrent-queue = { version = "2.5", features = ["loom"] }
plotters = { version = "0.3", optional = true, default-features = false, features = ["svg_backend"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
yring = "0.3.14"

[target.'cfg(all(loom, target_pointer_width = "64"))'.dependencies]
loom = "0.7"

[dev-dependencies]
core_affinity = "0.8.3"
crossbeam-channel = "0.5"
flume = "0.12"
kanal = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thingbuf = "0.1"

[features]
charts = ["dep:plotters", "dep:serde", "dep:serde_json"]

[[bench]]
name = "comparison"
harness = false
test = false

[[bench]]
name = "wake_latency"
harness = false
test = false

[[bench]]
name = "mpmc"
harness = false
test = false

[[bin]]
name = "fanring-chart"
path = "src/bin/chart.rs"
required-features = ["charts"]
