[workspace]
members = ["yring"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "ISC"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/fanring.rs"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[package]
name = "fanring"
version = "0.3.6"
edition = "2024"
rust-version = "1.93"
autobins = false
license = "ISC"
description = "High-throughput typed MPSC and MPMC channels with per-producer backpressure"
repository = "https://github.com/paddor/fanring.rs"
documentation = "https://docs.rs/fanring"
readme = "README.md"
keywords = ["mpsc", "mpmc", "ring-buffer", "lock-free", "batching"]
categories = ["concurrency", "data-structures"]
include = [
    "src/*.rs",
    "src/mpmc/**/*.rs",
    "src/mpsc/**/*.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "DESIGN.md",
    "doc/teardown.md",
]

[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(loom)"]

[features]
default = []
async = ["dep:atomic-waker"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
atomic-waker = { version = "1.1", optional = true }
arc-swap = "1.7"
concurrent-queue = { version = "2.5", features = ["loom"] }
yring = { version = "0.3.16", path = "yring" }

[target.'cfg(all(loom, target_pointer_width = "64"))'.dependencies]
loom = "0.7"

[dev-dependencies]
futures-lite = "2"
core_affinity = "0.8.3"
crossbeam-channel = "0.5"
crossfire = "3.1.19"
flume = "0.12"
kanal = "0.1"
plotters = { version = "0.3", default-features = false, features = ["svg_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thingbuf = "0.1"

[[bench]]
name = "comparison"
harness = false
test = false

[[bench]]
name = "wake_latency"
harness = false
test = false

[[bench]]
name = "mpmc"
harness = false
test = false

[[example]]
name = "fanring-chart"
path = "src/bin/chart.rs"
