name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  correctness:
    name: Correctness (without Loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.93
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.93.0 fmt --all --check
      - name: Run Clippy
        run: cargo +1.93.0 clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo +1.93.0 test --all-features
